<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Utrechts Archief – Startscherm</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="background-image"></div>
    <div class="overlay"></div>

    <div class="start-card fade-in">
      <h1 class="title">Utrechts Archief</h1>

      <img
        src="Beeldmateriaal/895.jpg"
        alt="Utrecht foto"
        class="center-photo"
      />

      <a href="panorama.php" class="open-button">Open panorama</a>

      <div class="info">
        <p>
          Het Panorama van Utrecht bestaat uit 33 pagina's met gedetailleerde
          tekeningen van de stad in 1859. Scroll door de pagina's om het
          complete panorama te bekijken.
        </p>
      </div>
    </div>

    <script>
      const foto = document.querySelector(".center-photo");

      if (foto) {
        foto.addEventListener("mouseenter", function () {
          foto.style.transform = "scale(1.05)";
        });

        foto.addEventListener("mouseleave", function () {
          foto.style.transform = "scale(1)";
        });
      }
    </script>
  </body>
</html>
